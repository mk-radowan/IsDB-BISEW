<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count posative negative zero and sum</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* background: linear-gradient(135deg, #ffd6e0, #cde7ff); */
            font-family: Arial, sans-serif;

        }

        .box {
            width: 320px;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            background: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #ff4d6d;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;

            background: #ffe5ec;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2> Number Analysis</h2>
        <p id="num">Watting ...</p>

    </div>
    <script>
        var data = [4, 5, -4, -1, 0, -8, 0, 45, 9];
        var positive = 0;
        var negetive = 0;
        let zero = 0;
        var sum = 0;

        for (i = 0; i < data.length; i++) {

            sum += data[i];

            if (data[i] > 0) {
                positive++;
            } else if (data[i] < 0) {
                negetive++;
            } else {
                zero++;
            }
        }

        document.getElementById("num").innerHTML = "Positive Number: " + positive + "<br>" +
            "Negetive Number: " + negetive + "<br>" +
            "Zero: " + zero + "<br> <br>" +
            " Sum: <b>" + sum + "</b>";

    </script>
</body>

</html>
