<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial of a number</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* background: linear-gradient(135deg, #ffd6e0, #cde7ff); */
            font-family: Arial, sans-serif;
        }

        .box {
            width: 300px;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            background: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        h2 {
            color: #ff4d6d;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #333;
            background: #ffe5ec;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Factorial Result</h2>
        <p id="num">Watting for input...</p>

    </div>
    <script>
        let num = parseInt(prompt("Enter a number: "));
        let fact = 1;

        if (num < 0) {
            document.getElementById("num").innerHTML = num + " : Invaild number"
        }
        else {
            for (let i = 1; i <= num; i++) {
                fact = fact * i;
            }
            document.getElementById("num").innerHTML = "Factorial of " + num + " is " + fact;
        }
    </script>

</body>

</html>
