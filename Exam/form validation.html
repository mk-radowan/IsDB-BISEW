<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
</head>

<body>
    <form name="f" onsubmit="return dtaValidation()">
        <label for="">ID:</label> <br>
        <input type="text" name="id"> <br> <br>

        <label for="">Name:</label> <br>
        <input type="text" name="name"> <br> <br>

        <label for="">Gender:</label>
        <input type="checkbox" name="checkGen" value="Male">
        <label for="">Male</label>
        <input type="checkbox" name="checkGen" value="Female">
        <label for="">Female</label>
        <input type="checkbox" name="checkGen" value="Other's">
        <label for="">Other's</label> <br> <br>

        <label for="">Email:</label> <br>
        <input type="text" name="email"> <br> <br>

        <label for="">Contac Number:</label> <br>
        <input type="text" name="phone"> <br> <br>

        <label for="">Password:</label> <br>
        <input type="text" name="password"> <br> <br>

        <input type="submit" value="submit">
        <input type="reset" value="Reset">
    </form>
    <script>
        function dtaValidation() {
            var textName = document.f.name.value;
            var textId = document.f.id.value;
            var textEmail = document.f.email.value;
            var textphone = document.f.phone.value;
            var textPass = document.f.password.value;

            if (textId == "") {
                alert("ID fill is emty");
                return false;
            }
            if (isNaN(textId)) {
                alert("ID is not vaild");
                return false;
            }

            if (textName == "") {
                alert("Name fill is emty");
                return false;
            }

            if (textEmail == "") {
                alert("Email is emty");
                return false;
            }

            if (textphone == "") {
                alert("Contac Number is emty");
                return false;
            }

            if (textphone.length < 11 || isNaN(textphone)) {
                alert("Contact Number is Invaild");
                return false;
            }

            if (textEmail.indexOf("@") == -1 || textEmail.indexOf(".") == -1) {
                alert("Invaild Email");
                return false;
            }

            if (textPass.length < 5 || textPass.length > 8) {
                alert("type password minimum 5 and maximum 6 charecter");
                return false;
            }

            var newWindow = window.open("");

            newWindow.document.write("<h2>Form Submitted Successfully!</h2>");
            newWindow.document.write("ID: " + textId + "<br>");
            newWindow.document.write("Name: " + textName + "<br>");
            newWindow.document.write("Email: " + textEmail + "<br>");
            newWindow.document.write("Contact Number: " + textphone + "<br>");
            newWindow.document.write("Pass: " + textPass + "<br>");

            newWindow.document.write("<input type='button' value='Close me' onclick='self.close()'>" + "   ");
            newWindow.document.write("   " + "<input type='button' value='Print' onclick='self.print()'>");

            return false; // Prevent actual form submission
        }


    </script>
</body>

</html>
